<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Preclick Demo</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#eef4ff; }
    .wrap { display:flex; min-height:100vh; align-items:center; justify-content:center; flex-direction:column; gap:24px; }
    #primary-btn {
      width: 360px; height: 120px; border-radius: 18px; border:none;
      background:#155eef; color:white; font-size:42px; font-weight:700; cursor:pointer;
      box-shadow: 0 12px 32px rgba(21,94,239,0.25);
    }
    #status { font-size: 28px; color:#123; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="status">Awaiting confirmed click</div>
    <button id="primary-btn" aria-label="Continue Safely" onclick="document.getElementById('status').textContent='Clicked safely'; this.textContent='Confirmed';">Continue Safely</button>
  </div>
</body>
</html>
